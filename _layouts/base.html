<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="topbar">
    <button type="button" class="topbar__toggle" id="nav-toggle"
            aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
    <span class="brand__name">{{ site.title }}</span>
  </div>

  <div class="layout">
    {% include sidebar.html %}
    <div class="sidebar__backdrop" id="sidebar-backdrop" hidden></div>

    <main class="content" id="main">
      {{ content }}
    </main>
  </div>

  {% include contact-modal.html %}

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
